[package]
name = "loki-cli"
description = "Headless development harness for Loki."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "loki"
path = "src/main.rs"

[dependencies]
loki-core.workspace = true
loki-runtime.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
