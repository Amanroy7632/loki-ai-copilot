[package]
name = "loki-core"
description = "Loki domain types and contracts. No OS, UI, IO, database or async-runtime dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Derives TypeScript bindings (ADR-0005). Off for normal builds, so product crates never compile
# ts-rs. Regenerate with `scripts/gen-contracts.sh`.
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
