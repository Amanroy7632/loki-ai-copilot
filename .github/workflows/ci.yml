# CI: the same checks as scripts/check.*, on native runners for each desktop OS (P1-T09).
# P5 added the JS job (lint, format, typecheck, tests). P11-T05 pins actions by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Lockfile must be committed and current; CI never silently updates it.
  CARGO_NET_RETRY: "3"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies (audio: ALSA; desktop: Tauri 2 / WebKitGTK)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (ts feature)
        run: cargo clippy -p loki-core --features ts --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  js:
    # Generation and the JS toolchain are platform independent, so one OS is enough.
    name: js (contracts current; lint, format, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Fail if generated contracts are stale
        run: ./scripts/gen-contracts.sh --check
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --strict (all packages)
        run: pnpm typecheck
      - name: eslint
        run: pnpm lint
      - name: prettier
        run: pnpm format:check
      - name: vitest
        run: pnpm test

  deny:
    name: cargo deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check   # deny.toml sets [graph] all-features = true
